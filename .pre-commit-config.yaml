# Skip for specific remote
skip: surnmain

repos:
  # --- Credential / secret scanning ---
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0          # pin a recent version
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(.*\.lock|package-lock\.json)$

  # --- Python linting (modern replacement for flake8) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0          # or latest
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]   # auto-fix + fail if changes needed
      - id: ruff-format

  # Optional but useful extras
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
